<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathiya Login</title>
  <style>
    body { 
      font-family: Arial; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0;
    }
    .box { 
      background: white; 
      padding: 40px; 
      border-radius: 20px; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      text-align: center;
      width: 300px;
    }
    h1 { color: #667eea; margin-bottom: 30px; }
    input { 
      width: 100%; 
      padding: 12px; 
      margin: 10px 0; 
      border: 2px solid #ddd; 
      border-radius: 8px; 
      box-sizing: border-box;
    }
    button { 
      width: 100%; 
      padding: 12px; 
      background: #667eea; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 16px; 
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #5568d3; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Sathiya</h1>
    <input type="text" placeholder="Username" id="user">
    <input type="password" placeholder="Password" id="pass">
    <button onclick="login()">Login</button>
    <p id="msg" style="color: green; margin-top: 15px;"></p>
  </div>
  <script>
    function login() {
      document.getElementById('msg').innerText = 'Login Successful! Welcome to Sathiya ❤️';
    }
  </script>
</body>
</html>
